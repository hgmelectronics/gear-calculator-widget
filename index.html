<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gear and Speed Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="input-section">
      <div class="unit-selector">
        <label for="unitSelect">Units</label>
        <select id="unitSelect" name="unitSystem">
          <option value="imperial" selected>Imperial (MPH, inches)</option>
          <option value="metric">Metric (KPH, mm)</option>
        </select>
      </div>

      <label for="transmissionSelect">Transmission</label>
      <select id="transmissionSelect">
        <option value="">-- Select Transmission --</option>
      </select>
      <p id="selectPrompt">Select a transmission to see speeds.</p>

      <label for="finalDrive">Final Drive Ratio</label>
      <input
        type="number"
        id="finalDrive"
        value="3.73"
        step="0.01"
        min="0.01"
      />

      <label for="transferCase">Transfer Case Ratio</label>
      <input
        type="number"
        id="transferCase"
        value="1.00"
        step="0.01"
        min="0.01"
      />

      <label for="tireSize">Tire Size</label>
      <input
        type="text"
        id="tireSize"
        spellcheck="false"
        autocorrect="off"
        autocapitalize="off"
        value="225/60R16"
        placeholder="225/60R16 or 33x12.50R15"
        title="Enter a metric tire size (225/60R16, LT265/75R16) or a flotation size (33x12.50R15). A bare number is the diameter in inches."
      />
      <div id="unloadedDiameterHint" class="hint"></div>

      <label for="rollingDiameter">Rolling Diameter</label>
      <input
        type="number"
        id="rollingDiameter"
        step="0.01"
        min="0.01"
        title="Measured rolling (loaded) diameter in the selected units. Leave empty to use the unloaded diameter from Tire Size."
      />

      <dl class="readouts">
        <dt>Tire Diameter</dt>
        <dd><output id="displayTireDiameter"></output></dd>
        <dt>Tire Circumference</dt>
        <dd><output id="displayTireCircumference"></output></dd>
        <dt>Driveshaft Turns</dt>
        <dd><output id="displayDriveshaftTurns"></output></dd>
        <dt>Transmission Output Turns</dt>
        <dd><output id="displayOutputTurns"></output></dd>
      </dl>

      <h3 id="gearRatioTableCaption">Gear Ratios</h3>
      <div class="table-scroll">
        <table id="gearRatioTable" class="results-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>

      <h3 id="resultsTableCaption">
        Vehicle Speed (<span id="speedUnitLabel">MPH</span>)
      </h3>
      <div class="table-scroll">
        <table id="resultsTable" class="results-table">
          <thead></thead>
          <tbody></tbody>
        </table>
      </div>
      <p id="errorMessage" class="error"></p>
    </div>
    <script src="gearmath.js"></script>
    <script src="transmissions.js"></script>
    <script src="calculator.js"></script>
  </body>
</html>
